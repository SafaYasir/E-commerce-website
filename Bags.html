<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crochet Bags | Crochet Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="Bags.css">
</head>

<body>


<!-- ================= NAVBAR ================= -->

<header>

    <div class="logo">
        Crochet<span>Store</span>
    </div>

    <nav>
        <ul>

            <li>
                <a href="./index.html">Home</a>
            </li>

            <li>
                <a href="./products.html">Products</a>
            </li>

            <li>
                <a href="./about.html">About</a>
            </li>

            <li>
                <a href="./contact.html">Contact</a>
            </li>

            <li>
                <a href="./Bags.html" class="active">
                    Bags
                </a>
            </li>

        </ul>
    </nav>

</header>



<!-- ================= MAIN CONTAINER ================= -->

<div class="container">


    <!-- ================= BAG HEADING ================= -->

    <section class="bags-heading">

        <span>
            Handmade Collection 🧶
        </span>

        <h1>
            Crochet Bags
        </h1>

        <p>
            Discover beautiful handmade crochet bags
            made with love and care.
        </p>

    </section>



    <!-- ================= SEARCH ================= -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search crochet bags..."
        >

        <button onclick="searchProducts()">

            <i class="fa-solid fa-magnifying-glass"></i>

        </button>

    </div>



    <!-- ================= FILTER ================= -->

    <div class="filter-buttons">

        <button
            class="active"
            onclick="filterProducts('all', this)">

            All Bags

        </button>

        <button
            onclick="filterProducts('handbag', this)">

            Hand Bags

        </button>

        <button
            onclick="filterProducts('shoulder', this)">

            Shoulder Bags

        </button>

        <button
            onclick="filterProducts('tote', this)">

            Tote Bags

        </button>

        <button
            onclick="filterProducts('mini', this)">

            Mini Bags

        </button>

    </div>



    <!-- ================= PRODUCTS ================= -->

    <section class="products-section">

        <div
            class="products-grid"
            id="productsGrid">
        </div>

    </section>



    <!-- ================= CART ================= -->

    <section
        class="cart-section"
        id="cart">

        <h2>
            🛒 Your Bag Cart
        </h2>


        <div id="cartItems">

            <p class="empty-cart">
                Your cart is empty.
            </p>

        </div>


        <div class="cart-total">

            <h3>
                Total: £<span id="cartTotal">0</span>
            </h3>

            <button
                class="order-btn"
                onclick="orderDone()">

                <i class="fa-brands fa-whatsapp"></i>

                Order Done

            </button>

        </div>

    </section>


</div>



<!-- ================= FOOTER ================= -->

<footer>

    <h2>
        Crochet Store
    </h2>

    <p>
        Handmade with ❤️
    </p>


    <div class="social">

        <a
            href="https://wa.me/923001234567"
            target="_blank">

            <i class="fa-brands fa-whatsapp"></i>

        </a>

        <a
            href="https://instagram.com/your_username"
            target="_blank">

            <i class="fa-brands fa-instagram"></i>

        </a>

        <a
            href="https://tiktok.com/@your_username"
            target="_blank">

            <i class="fa-brands fa-tiktok"></i>

        </a>

    </div>


    <p>
        © 2026 Crochet Store
    </p>

</footer>



<script src="Bags.js"></script>

</body>
</html>
